<g class="dg-node" id="debate-analyze" data-node="analyze" data-file="→ results/metrics.json" data-desc="정확도뿐 아니라 정답→오답 전환, 채택한 동료가 더 길었는지, 어느 모델이 합의를 지배하는지를 센다." tabindex="0">
<title>analyze.py — 정확도뿐 아니라 정답→오답 전환, 채택한 동료가 더 길었는지, 어느 모델이 합의를 지배하는지를 센다.</title>
