<text class="dg-t" x="812" y="71">worker_vllm.py</text>
<text class="dg-s" x="812" y="88">서브프로세스 1개</text>
<text class="dg-s" x="812" y="103">= 모델 1개 로드</text>
<text class="dg-s" x="812" y="118">vLLM chat 배치 생성</text>
<text class="dg-s" x="812" y="133">in/out JSON</text>
<text class="dg-f" x="812" y="157">results/batches/</text>
</g>
<g class="dg-node" id="debate-config" data-node="config" data-file="" data-desc="모델·라운드·조건·디코딩·경로를 한 곳에 둔다." tabindex="0">
<title>config.py — 모델·라운드·조건·디코딩·경로를 한 곳에 둔다.</title>
