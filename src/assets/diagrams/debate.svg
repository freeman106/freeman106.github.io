<text class="dg-s" x="198" y="88">200 + 200 문항</text>
<text class="dg-s" x="198" y="103">HotpotQA closed-book</text>
<text class="dg-f" x="198" y="157">load_questions</text>
</g>
<g class="dg-node" id="debate-prompts" data-node="prompts" data-file="" data-desc="R0 프롬프트는 조건과 무관하고, R1·R2에서만 한 줄 추가(anti_syco)나 동료 추론 은닉(length_robust)이 들어간다." tabindex="0">
<title>prompts.py — R0 프롬프트는 조건과 무관하고, R1·R2에서만 한 줄 추가(anti_syco)나 동료 추론 은닉(length_robust)이 들어간다.</title>
<rect class="dg-bx" x="352" y="52" width="190" height="114" rx="3"/>
<text class="dg-t" x="364" y="71">prompts.py</text>
<text class="dg-s" x="364" y="88">R0 독립 답변 · 토론 메시지</text>
<text class="dg-s" x="364" y="103">조건별 peer block:</text>
<text class="dg-s" x="364" y="118">baseline · anti_syco</text>
<text class="dg-s" x="364" y="133">length_robust (추론 은닉)</text>
</g>
<g class="dg-node" id="debate-orchestrate" data-node="orchestrate" data-file="orchestrate.py" data-desc="R0가 조건 독립적이고 temp=0이라 한 번만 생성해 공유한다. 라운드 안의 job은 독립이라 GPU를 채워 돌린다." tabindex="0">
<title>orchestrate.py — R0가 조건 독립적이고 temp=0이라 한 번만 생성해 공유한다. 라운드 안의 job은 독립이라 GPU를 채워 돌린다.</title>
<rect class="dg-bx" x="558" y="52" width="226" height="114" rx="3"/>
<text class="dg-t" x="570" y="71">orchestrate.py</text>
<text class="dg-s" x="570" y="88">R0 1회 생성 → 3조건에 공유</text>
<text class="dg-s" x="570" y="103">R1·R2: 조건×모델 job 풀링</text>
<text class="dg-s" x="570" y="118">GPU wave 실행 · 실패 시 재시도</text>
<text class="dg-s" x="570" y="133">라운드마다 records.jsonl checkpoint</text>
<text class="dg-f" x="570" y="157">orchestrate.py</text>
</g>
<g class="dg-node" id="debate-worker" data-node="worker" data-file="results/batches/" data-desc="모델마다 프로세스를 새로 띄워 GPU 메모리를 깨끗이 반환한다." tabindex="0">
<title>worker_vllm.py — 모델마다 프로세스를 새로 띄워 GPU 메모리를 깨끗이 반환한다.</title>
