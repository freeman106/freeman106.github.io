<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 339.70000000000005" width="990" height="339.70000000000005" role="img" aria-labelledby="pdf-image-eval-title" data-diagram="pdf-image-eval">
<title id="pdf-image-eval-title">식당 이미지 자동 평가 — 업무 흐름</title>
<style>
  .dg-grp { fill: none; stroke: var(--dg-group, #e2e2e2); stroke-width: 1; }
  .dg-grp-l { font: 500 14.3px ui-monospace, "JetBrains Mono", Menlo, monospace; fill: var(--dg-meta, #888); letter-spacing: .04em; }
  .dg-bx { fill: var(--dg-box, #ffffff); stroke: var(--dg-line, #c4c4c4); stroke-width: 1; }
  .dg-bx-ext { fill: var(--dg-ext, #f4f4f4); stroke: var(--dg-line, #c4c4c4); stroke-width: 1; stroke-dasharray: 4 3; }
  .dg-bx-state { fill: var(--dg-state, #fafafa); stroke: var(--dg-line, #c4c4c4); stroke-width: 1; }
  .dg-node:hover rect, .dg-node:focus rect, .dg-node.is-active rect { stroke: var(--dg-accent, #2563eb); }
  .dg-node:focus { outline: none; }
  .dg-t { font: 500 16.900000000000002px Pretendard, "Pretendard Variable", -apple-system, system-ui, sans-serif; fill: var(--dg-text, #111); }
  .dg-s { font: 14.3px Pretendard, "Pretendard Variable", -apple-system, system-ui, sans-serif; fill: var(--dg-body, #555); }
  .dg-f { font: 13.65px ui-monospace, "JetBrains Mono", Menlo, monospace; fill: var(--dg-meta, #888); }
  .dg-ar { fill: none; stroke: var(--dg-arrow, #9a9a9a); stroke-width: 1.2; marker-end: url(#pdf-image-eval-ah); }
  .dg-ar-d { stroke-dasharray: 4 3; }
  .dg-al { font: 13.65px Pretendard, "Pretendard Variable", -apple-system, system-ui, sans-serif; fill: var(--dg-meta, #888); }
  .dg-node { cursor: default; }
</style>
<defs><marker id="pdf-image-eval-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dg-arrow, #9a9a9a)"/></marker></defs>
